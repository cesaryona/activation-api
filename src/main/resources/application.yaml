server:
  port: ${PORT:8080}

spring:
  application:
    name: activation-api
  http:
    clients:
      connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
      imperative:
        factory: simple

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

provider:
  base-url: ${PROVIDER_URL:http://localhost:8089}

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  fixed-delay: ${SCHEDULER_FIXED_DELAY:5s}
  batch-size: ${SCHEDULER_BATCH_SIZE:20}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
