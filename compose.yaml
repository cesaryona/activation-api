services:

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      PROVIDER_URL: http://provider:8080

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"

  provider:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock